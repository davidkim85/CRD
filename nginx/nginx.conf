worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 20M;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Rate limiting (1 request per second per IP)
    limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name www.davidka.co.il davidka.co.il;
        return 301 https://$host$request_uri;
    }

    # HTTPS server with HTTP/2
    server {
        listen 443 ssl http2;
        server_name www.davidka.co.il davidka.co.il;

        ssl_certificate     /app/ssl/furman.pem;
        ssl_certificate_key /app/ssl/furman.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        access_log /dev/stdout main;
        error_log  /dev/stderr warn;

        # Apply rate limiting
        limit_req zone=one burst=10 nodelay;

        # FastAPI backend
        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
        }

        # Static files
        location /static/ {
            alias /static/;
            try_files $uri $uri/ =404;
            expires 30d;
            add_header Cache-Control "public";
            limit_except GET {
                deny all;
            }
        }

        # Uploaded media files
        location /uploads/ {
            alias /app/uploads/;
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=86400";
            limit_except GET {
                deny all;
            }
        }

        # Deny dangerous file types
        location ~* /uploads/.*\.(php|sh|py|pl|cgi|exe|js)$ {
            deny all;
        }
    }
}
